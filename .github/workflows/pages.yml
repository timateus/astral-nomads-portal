name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA fallback: Pages serves 404.html for deep links like /item/artifact/...
      - run: cp dist/index.html dist/404.html
      # the previous interface lives on the v1-modern branch and is served from /v1/
      - uses: actions/checkout@v4
        with:
          ref: v1-modern
          path: v1src
      - run: npm ci && npm run build
        working-directory: v1src
        env:
          BASE_PATH: /${{ github.event.repository.name }}/v1/
      - run: cp -r v1src/dist dist/v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
